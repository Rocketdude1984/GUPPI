<!DOCTYPE html>
<html>
<head>
  <title>Voice Calculator</title>
  <style>
    /* The toggle button changes color and text depending on state */
    #micBtn {
      font-size: 1.2rem;
      padding: 12px 32px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #4caf50;  /* green = listening */
      color: white;
    }

    #micBtn.off {
      background: #e53935;  /* red = stopped */
    }
  </style>
</head>
<body>

  <!-- Button doubles as the toggle switch -->
  <button id="micBtn" class="off">Start Listening</button>

  <p id="heard">Heard: </p>
  <p id="result">Result: </p>

  <script>

    // ── STEP 1: GRAB THE HTML ELEMENTS ──────────────────────────────
    const micBtn = document.getElementById('micBtn');
    const heard  = document.getElementById('heard');
    const result = document.getElementById('result');


    // ── STEP 2: SET UP SPEECH RECOGNITION ───────────────────────────
    const recognition = new webkitSpeechRecognition();
    recognition.continuous     = true;
    recognition.interimResults = true;

    let transcript = '';
    let pauseTimer = null;
    let processing = false;
    let listening  = false;  // tracks whether we are on or off


    // ── STEP 3: TOGGLE ON/OFF WHEN BUTTON IS TAPPED ─────────────────
    micBtn.addEventListener('click', function() {
      if (listening) {
        // Currently ON → turn OFF
        listening  = false;
        processing = false;
        clearTimeout(pauseTimer);
        recognition.stop();
        micBtn.textContent = 'Start Listening';
        micBtn.classList.add('off');       // turns red
        heard.textContent  = 'Heard: stopped.';
      } else {
        // Currently OFF → turn ON
        listening  = true;
        transcript = '';
        processing = false;
        recognition.start();
        micBtn.textContent = 'Stop Listening';
        micBtn.classList.remove('off');    // turns green
        heard.textContent  = 'Heard: listening...';
        result.textContent = 'Result: ';
      }
    });


    // ── STEP 4: WHAT HAPPENS WHEN SPEECH IS CAPTURED ────────────────
    recognition.onresult = function(event) {

      if (processing) return;

      let interimText = '';
      let finalText   = '';

      for (let i = event.resultIndex; i < event.results.length; i++) {
        const chunk = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalText += chunk + ' ';
        } else {
          interimText += chunk;
        }
      }

      transcript += finalText;
      const fullText = (transcript + ' ' + interimText).trim().toLowerCase();
      heard.textContent = 'Heard: ' + fullText;

      if (fullText.includes('equals')) {
        clearTimeout(pauseTimer);
        processExpression(fullText.replace('equals', '').trim());
        return;
      }

      clearTimeout(pauseTimer);
      pauseTimer = setTimeout(function() {
        processExpression(fullText);
      }, 1000);
    };


    // ── PROCESS AND RESET ────────────────────────────────────────────
    function processExpression(text) {
      processing = true;
      transcript = '';
      clearTimeout(pauseTimer);

      const answer = parseAndCalculate(text);

      if (answer !== null) {
        result.textContent = 'Result: ' + answer;
        const spokenAnswer = numberToWords(answer);
        speak(spokenAnswer, function() {
          processing = false;
          heard.textContent = 'Heard: listening for next expression...';
        });
      } else {
        processing = false;
        result.textContent = 'Result: Could not understand. Try again...';
      }
    }


    // ── STEP 5: PARSE THE TEXT AND DO THE MATH ──────────────────────
    function parseAndCalculate(text) {
      text = text.toLowerCase();
      text = text.replace('plus', '+');

      const parts = text.split('+');
      if (parts.length !== 2) return null;

      const numA = wordToNumber(parts[0].trim());
      const numB = wordToNumber(parts[1].trim());
      if (numA === null || numB === null) return null;

      return numA + numB;
    }


    // ── STEP 6: CONVERT WORD NUMBERS TO ACTUAL NUMBERS ──────────────
    function wordToNumber(phrase) {
      phrase = phrase.replace(/,/g, '');
      if (!isNaN(phrase) && phrase.trim() !== '') return parseFloat(phrase);

      const map = {
        'zero':0, 'one':1, 'two':2, 'three':3, 'four':4,
        'five':5, 'six':6, 'seven':7, 'eight':8, 'nine':9,
        'ten':10, 'eleven':11, 'twelve':12, 'thirteen':13, 'fourteen':14,
        'fifteen':15, 'sixteen':16, 'seventeen':17, 'eighteen':18, 'nineteen':19,
        'twenty':20, 'thirty':30, 'forty':40, 'fifty':50, 'sixty':60, 'seventy':70,
        'eighty':80, 'ninety':90, 'hundred':100, 'thousand':1000, 'million':1000000
      };

      let total = 0, current = 0;

      for (const word of phrase.split(' ')) {
        const value = map[word];
        if (value === undefined)  continue;
        else if (value === 100)   current *= 100;
        else if (value >= 1000) { total += (current || 1) * value; current = 0; }
        else                      current += value;
      }

      total += current;
      return total;
    }

      // Convert a number to spoken words e.g. 1329 → "one thousand three hundred twenty nine"
  function numberToWords(n) {
    if (n === 0) return 'zero';

    const ones     = ['','one','two','three','four','five','six','seven','eight','nine',
                      'ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen',
                      'seventeen','eighteen','nineteen'];
    const tens     = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];

    function helper(num) {
      if (num === 0)        return '';
      if (num < 20)         return ones[num] + ' ';
      if (num < 100)        return tens[Math.floor(num/10)] + ' ' + helper(num % 10);
      if (num < 1000)       return ones[Math.floor(num/100)] + ' hundred ' + helper(num % 100);
      if (num < 1000000)    return helper(Math.floor(num/1000)) + 'thousand ' + helper(num % 1000);
      return                       helper(Math.floor(num/1000000)) + 'million ' + helper(num % 1000000);
    }

    return helper(n).trim();
  }


    // ── STEP 7: SPEAK THE RESULT ALOUD ──────────────────────────────
    function speak(text, onDone) {
      setTimeout(function() {
        const utterance = new SpeechSynthesisUtterance(String(text));
      if (onDone) utterance.onend = onDone;
      window.speechSynthesis.speak(utterance);
      }, 500);
    }

  </script>
</body>
</html>
