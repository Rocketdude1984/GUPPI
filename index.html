<!DOCTYPE html>
<html>
<head>
  <title>Voice Calculator</title>
</head>
<body>

  <!-- A button the user taps to start listening -->
  <button id="micBtn">Tap to Speak</button>

  <!-- Two paragraphs to show what was heard, and the result -->
  <p id="heard">Heard: </p>
  <p id="result">Result: </p>

  <script>

    // ── STEP 1: GRAB THE HTML ELEMENTS ──────────────────────────────
    // We store references to the button and paragraphs so we can
    // update them from JavaScript later.
    const micBtn = document.getElementById('micBtn');
    const heard  = document.getElementById('heard');
    const result = document.getElementById('result');


    // ── STEP 2: SET UP SPEECH RECOGNITION ───────────────────────────
    // The browser has a built-in speech-to-text engine.
    // "webkitSpeechRecognition" is the version Chrome uses.
    const recognition = new webkitSpeechRecognition();

    // Tell it to stop listening after the user pauses speaking.
    // (If false, it would listen forever in a loop.)
    recognition.continuous = true;

    // Tell it we want the final result, not live guesses while speaking.
    recognition.interimResults = true;


    // ── STEP 3: WHAT HAPPENS WHEN THE BUTTON IS TAPPED ──────────────
    micBtn.addEventListener('click', function() {
      recognition.start(); // Start the microphone and begin listening
      heard.textContent  = 'Heard: listening...';
      result.textContent = 'Result: ';
    });


    // ── STEP 4: WHAT HAPPENS WHEN SPEECH IS CAPTURED ────────────────
    // When the user stops talking, the browser fires this "onresult" event.
    // It gives us a "results" object containing what it heard.
    recognition.onresult = function(event) {

      let interimText = '';
      let finalText = '';

      for (let i = 0; i < event.results.length; i++){
        const chunk = event.results[i][0].transcript;
        if (event.results[i].isFinal){
          finalText += chunk = ' ';
        } else {
          interimText += chunk;
        }
      }

      transcript = (finalText + interimText).trim().toLowerCase();
      heard.textContent = 'Heard: ' + transcript

      if (transcript.includes('equals')) {
        const expression = transcript.replace('equals', ' ').trim();
        clearTimeout(pauseTimer);
        processExpression(expression);
        return;
      }

      clearTimeout(pauseTimer);
      pauseTimer = setTimeout(function(){
        processExpression(transcript);
      }, 1000);
    };

    function processExpression(text) {
      transcript = '';

      const answer = parseAndCalculate(text);

      if (answer !== null) {
        result.textContent = 'Result: ' + answer;
        speak(answer, function(){
          heard.textContent = 'Heard: listening for next expression...';
        });
      } else {
        result.textContent = 'Result: Could not understand. Try Again...';
      }
      
    }


    // ── STEP 5: PARSE THE TEXT AND DO THE MATH ──────────────────────
    // This function takes a string like "three plus five"
    // and returns 8, or null if it can't figure it out.
    function parseAndCalculate(text) {

      // Convert to lowercase so "Plus" and "plus" both work
      text = text.toLowerCase();

      // Replace the word "plus" with the "+" character
      text = text.replace('plus', '+');

      // Split the string into two parts at the "+" sign
      // e.g. "three + five" becomes ["three ", " five"]
      const parts = text.split('+');

      // If we didn't get exactly two parts, we can't continue
      if (parts.length !== 2) return null;

      // Convert each part (which might be a word like "three") to a number
      const numA = wordToNumber(parts[0].trim());
      const numB = wordToNumber(parts[1].trim());

      // If either conversion failed, return null
      if (numA === null || numB === null) return null;

      // Add them and return the result
      return numA + numB;
    }


    // ── STEP 6: CONVERT WORD NUMBERS TO ACTUAL NUMBERS ──────────────
    // This function turns "three" into 3, "12" into 12, etc.
    function wordToNumber(phrase) {

      phrase = phrase.replace(/,/g, '');

      // If it's already a plain number like "12", just return it directly
      if (!isNaN(phrase) && phrase.trim() != '') return parseFloat(phrase);

      let total = 0;
      let current = 0;

      const map = {
        'zero':0, 'one':1, 'two':2, 'three':3, 'four':4,
        'five':5, 'six':6, 'seven':7, 'eight':8, 'nine':9,
        'ten':10, 'eleven':11, 'twelve':12, 'thirteen':13, 'fourteen':14,
        'fifteen':15, 'sixteen':16, 'seventeen':17, 'eighteen':18, 'nineteen':19,
        'twenty':20, 'thirty':30, 'forty':40, 'fifty':50, 'sixty':60, 'seventy':70,
        'eighty':80, 'ninety':90, 'hundred':100, 'thousand':1000, 'million':1000000
      };

      for (const word of phrase.split(' ')){
        const value = map[word];

        if (value === undefined) continue;
        else if (value === 100) current *= 100;
        else if (value >= 1000) {total += (current || 1)*value; current = 0;}
        else current += value;
      };

      total += current;
      return total;
    }


    // ── STEP 7: SPEAK THE RESULT ALOUD ──────────────────────────────
    // The browser also has a built-in text-to-speech engine.
    function speak(text, onDone) {
      const utterance = new SpeechSynthesisUtterance(String(text));
      if (onDone) utterance.onend = onDone;
      window.speechSynthesis.speak(utterance);
    }

  </script>
</body>
</html>
